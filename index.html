<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTB Setup Lab v3</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; text-align: center; padding: 10px; margin: 0; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; text-align: left; }
        h2, h3 { text-align: center; color: #007bff; margin: 5px 0; }
        .tab-bar { display: flex; gap: 2px; margin-bottom: 15px; background: #333; border-radius: 10px; overflow: hidden; }
        .tab-btn { flex: 1; padding: 12px; background: #333; border: none; color: white; cursor: pointer; }
        .tab-btn.active { background: #007bff; font-weight: bold; }
        label { display: block; margin-top: 10px; font-size: 0.75em; color: #aaa; text-transform: uppercase; }
        input, textarea { width: 100%; padding: 10px; margin-top: 4px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: white; box-sizing: border-box; }
        button.main-action { background: #007bff; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; width: 100%; margin-top: 15px; }
        .record { background: #dc3545 !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        .archive-item { background: #2a2a2a; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 0.85em; border-left: 4px solid #444; position: relative; }
        .delete-btn { position: absolute; right: 10px; top: 10px; color: #dc3545; font-size: 1.2em; border: none; background: none; }
        #chart-container { background: white; border-radius: 8px; margin-top: 10px; height: 300px; width: 100%; position: relative; display: none; }
        .feedback-box { border-top: 1px solid #444; margin-top: 10px; padding-top: 10px; font-style: italic; color: #ddd; }
    </style>
</head>
<body>

    <h2>MTB Setup Lab 🚲</h2>

    <div class="tab-bar">
        <button onclick="showPage('measure')" id="btn-measure" class="tab-btn active">Trail</button>
        <button onclick="showPage('rebound')" id="btn-rebound" class="tab-btn">Rebound</button>
        <button onclick="showPage('archive')" id="btn-archive" class="tab-btn">Archiv</button>
    </div>

    <!-- SEITE: TRAIL AUFNAHME -->
    <div id="page-measure">
        <div class="card" id="setup-area">
            <h3>Lauf-Konfiguration</h3>
            <input type="text" id="runName" placeholder="Trail Name...">
            <div style="display:flex; gap:10px;">
                <div style="flex:1;"><label>PSI</label><input type="number" id="springVal" value="80"></div>
                <div style="flex:1;"><label>LSR</label><input type="number" id="lsrVal" value="5"></div>
            </div>
            <button id="reqBtn" class="main-action">1. Sensoren aktivieren</button>
            <button id="mainBtn" class="main-action" style="display:none;">START AUFNAHME</button>
        </div>

        <div id="feedback-modal" class="card" style="display:none;">
            <h3>Subjektive Bewertung</h3>
            <label>Grip (1=Rutschig, 5=Schiene)</label>
            <input type="range" id="rate-grip" min="1" max="5" value="3">
            <label>Arm-Pump (1=Entspannt, 5=Beton)</label>
            <input type="range" id="rate-arm" min="1" max="5" value="1">
            <label>Kommentar</label>
            <textarea id="run-comment" rows="2"></textarea>
            <button onclick="finalizeSave()" class="main-action" style="background:#28a745;">Speichern</button>
        </div>
    </div>

    <!-- SEITE: REBOUND TEST -->
    <div id="page-rebound" style="display:none;">
        <div class="card">
            <h3>Bordstein-Assistent</h3>
            <button id="reboundStartBtn" class="main-action" style="background:#6f42c1;">Test Starten (3s)</button>
            <div id="reboundResult" style="margin-top:15px; text-align:center; font-weight: bold;"></div>
        </div>
    </div>

    <!-- SEITE: ARCHIV -->
    <div id="page-archive" style="display:none;">
        <div id="chart-container"><canvas id="myChart"></canvas></div>
        <div id="compareDetails"></div>
        <div id="archive-list" style="margin-top: 15px;"></div>
    </div>

    <script>
        let accelerationData = [];
        let isRecording = false;
        let chart = null;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(e => console.log(e));
        }

        function showPage(page) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + page).classList.add('active');
            document.getElementById('page-measure').style.display = page === 'measure' ? 'block' : 'none';
            document.getElementById('page-rebound').style.display = page === 'rebound' ? 'block' : 'none';
            document.getElementById('page-archive').style.display = page === 'archive' ? 'block' : 'none';
            if(page === 'archive') {
                document.getElementById('chart-container').style.display = 'none';
                renderArchive();
            }
        }

        document.getElementById('reqBtn').onclick = () => {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().then(res => { if(res == 'granted') activate(); });
            } else { activate(); }
        };

        function activate() {
            document.getElementById('reqBtn').style.display = 'none';
            document.getElementById('mainBtn').style.display = 'block';
            window.addEventListener('devicemotion', (e) => {
                if (!isRecording) return;
                let acc = e.acceleration || e.accelerationIncludingGravity;
                let total = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
                let val = Math.abs(total - 9.81);
                if(val > 0.4) {
                    accelerationData.push(parseFloat(val.toFixed(2)));
                    document.getElementById('mainBtn').innerText = `STOPP (${accelerationData.length})`;
                }
            });
        }

        document.getElementById('mainBtn').onclick = function() {
            if (!isRecording) {
                accelerationData = [];
                isRecording = true;
                this.classList.add('record');
            } else {
                isRecording = false;
                this.classList.remove('record');
                this.innerText = "START AUFNAHME";
                document.getElementById('setup-area').style.display = 'none';
                document.getElementById('feedback-modal').style.display = 'block';
            }
        };

        function finalizeSave() {
            if(accelerationData.length < 5) { alert("Zu wenig Daten!"); return; }
            
            const run = {
                id: Date.now(),
                date: new Date().toLocaleString('de-DE'),
                name: document.getElementById('runName').value || "Unbenannt",
                setup: { psi: document.getElementById('springVal').value, lsr: document.getElementById('lsrVal').value },
                feedback: { 
                    grip: document.getElementById('rate-grip').value, 
                    arm: document.getElementById('rate-arm').value,
                    msg: document.getElementById('run-comment').value 
                },
                data: [...accelerationData]
            };

            let runs = JSON.parse(localStorage.getItem('mtb_runs') || '[]');
            runs.push(run);
            localStorage.setItem('mtb_runs', JSON.stringify(runs));
            
            document.getElementById('feedback-modal').style.display = 'none';
            document.getElementById('setup-area').style.display = 'block';
            showPage('archive');
        }

        // REBOUND TEST MIT STARKER GLÄTTUNG
        document.getElementById('reboundStartBtn').onclick = function() {
            this.innerText = "MESSUNG...";
            this.classList.add('record');
            accelerationData = [];
            isRecording = true;
            setTimeout(() => {
                isRecording = false;
                this.innerText = "Test Starten (3s)";
                this.classList.remove('record');
                processReboundTest();
            }, 3000);
        };

        function processReboundTest() {
            if(accelerationData.length < 10) {
                document.getElementById('reboundResult').innerText = "Fehler: Keine Bewegung erkannt.";
                return;
            }

            // 1. Glättung: Gleitender Durchschnitt über 5 Werte
            let smoothed = [];
            for(let i=2; i<accelerationData.length-2; i++) {
                let avg = (accelerationData[i-2]+accelerationData[i-1]+accelerationData[i]+accelerationData[i+1]+accelerationData[i+2])/5;
                smoothed.push(avg);
            }

            // 2. Peaks zählen (nur deutliche Amplituden)
            let osc = 0;
            const threshold = Math.max(...smoothed) * 0.4;
            for(let i=1; i<smoothed.length-1; i++) {
                if(smoothed[i] > threshold && smoothed[i] > smoothed[i-1] && smoothed[i] > smoothed[i+1]) {
                    osc++;
                }
            }

            let realOsc = Math.max(0, osc - 1); // Erster Einschlag abziehen
            let advice = realOsc === 0 ? "✅ Stabil!" : realOsc === 1 ? "🟡 Okay." : `🐢 Zu schnell! (${realOsc} Hübe)`;
            document.getElementById('reboundResult').innerHTML = `Gefundene Schwingungen: ${realOsc}<br>${advice}`;
        }

        function renderArchive() {
            const list = document.getElementById('archive-list');
            let runs = JSON.parse(localStorage.getItem('mtb_runs') || '[]');
            list.innerHTML = "";
            runs.reverse().forEach(run => {
                const item = document.createElement('div');
                item.className = 'archive-item';
                item.innerHTML = `
                    <button class="delete-btn" onclick="deleteRun(${run.id}); event.stopPropagation();">×</button>
                    <b>${run.name}</b><br><small>${run.date} | PSI: ${run.setup.psi}</small>
                `;
                item.onclick = () => renderSingleChart(run);
                list.appendChild(item);
            });
        }

        function renderSingleChart(run) {
            document.getElementById('chart-container').style.display = 'block';
            const ctx = document.getElementById('myChart').getContext('2d');
            if(chart) chart.destroy();
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: run.data.map((_, i) => i),
                    datasets: [{
                        label: 'g-Kraft',
                        data: run.data,
                        borderColor: '#007bff',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    scales: { y: { beginAtZero: true, grid: { color: '#444' } }, x: { display: false } }
                }
            });
            window.scrollTo(0,0);
        }

        function deleteRun(id) {
            let runs = JSON.parse(localStorage.getItem('mtb_runs') || '[]');
            localStorage.setItem('mtb_runs', JSON.stringify(runs.filter(r => r.id !== id)));
            renderArchive();
        }
    </script>
</body>
</html>
